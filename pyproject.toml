[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hotmic"
version = "0.1.0"
description = "Continuous mic buffer with on-demand save"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "sounddevice",
    "docopt-ng",
]

[project.optional-dependencies]
transcribe = ["mlx-whisper"]
diarize = ["mlx-whisper", "diarize"]
# silero-vad is used only for its bundled silero_vad.onnx model file;
# the package API (and its torch dependency) is never imported at runtime.
vad = ["silero-vad", "onnxruntime"]
all = ["mlx-whisper", "diarize", "silero-vad", "onnxruntime"]

[project.scripts]
hotmic = "hotmic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
